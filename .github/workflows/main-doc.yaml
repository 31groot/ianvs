name: CI

on:
  push:
    branches:
      - main
    tags:
    paths:
      - '**.md'
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-22.04
    name: pylint
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11" ]
    steps:
      - run: 'echo "only docs modified, no need to trigger CI"'
